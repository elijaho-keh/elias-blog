<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Dailies</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    // Apply a saved theme before the page is drawn, so it never flashes
    try {
      const theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/login.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="brand" href="/">Dailies</a>
    <nav class="site-nav" aria-label="Main">
      <a href="https://eliasdykert.se">Portfolio <span aria-hidden="true">↗</span></a>
    </nav>
  </header>

  <main id="main" class="form-page">
    <a class="back" href="/">← All stories</a>
    <h1 class="form-page__title">Log in</h1>
    <p class="form-page__intro">For the author only. There's no public sign-up.</p>

    <form class="form" id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username"
               autocapitalize="none" spellcheck="false" maxlength="100" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               maxlength="200" required>
      </div>
      <p class="form-error" id="login-error" role="alert"></p>
      <button class="button" type="submit">Log in</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>© 2026 Elias Grünewald Dykert, Stockholm</p>
    <p><a href="https://eliasdykert.se">eliasdykert.se</a></p>
  </footer>
</body>
</html>
