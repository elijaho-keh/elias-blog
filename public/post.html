<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dailies — Elias Grünewald Dykert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/post.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="brand" href="/">Dailies</a>
    <nav class="site-nav" aria-label="Main">
      <span class="auth-nav" id="auth-nav"></span>
      <a href="https://eliasdykert.se">Portfolio <span aria-hidden="true">↗</span></a>
    </nav>
  </header>

  <main id="main" class="post">
    <a class="back" href="/">← All stories</a>
    <p class="status" id="post-status" role="status">Loading story…</p>
    <article id="post"></article>

    <section class="post-section comments" id="comments" aria-labelledby="comments-heading" hidden>
      <h2 class="label post-section__label" id="comments-heading">Comments</h2>
      <p class="comments__status" id="comments-status" role="status">Loading comments…</p>
      <ol class="comment-list" id="comment-list"></ol>

      <form class="form comment-form" id="comment-form" novalidate>
        <h3 class="comment-form__title">Leave a comment</h3>
        <div class="field">
          <label for="comment-name">Name</label>
          <input id="comment-name" name="name" type="text" maxlength="60" autocomplete="name"
                 aria-describedby="comment-name-error">
          <p class="field-error" id="comment-name-error"></p>
        </div>
        <div class="field">
          <label for="comment-body">Comment</label>
          <textarea id="comment-body" name="body" rows="5" maxlength="2000"
                    aria-describedby="comment-body-count comment-body-error"></textarea>
          <p class="field-hint" id="comment-body-count">0 / 2000</p>
          <p class="field-error" id="comment-body-error"></p>
        </div>
        <!-- Hidden from people; only spam bots fill it in -->
        <div class="trap" aria-hidden="true">
          <label for="comment-website">Website</label>
          <input id="comment-website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>
        <p class="form-error" id="comment-error" role="alert"></p>
        <button class="button" type="submit">Post comment</button>
      </form>
    </section>

    <nav class="post__end" id="post-end" aria-label="Back" hidden>
      <a class="back" href="/">← Back to all stories</a>
    </nav>
  </main>

  <footer class="site-footer">
    <p>© 2026 Elias Grünewald Dykert, Stockholm</p>
    <p class="site-footer__links">
      <a href="https://eliasdykert.se">eliasdykert.se</a>
      <a href="/login.html" id="footer-login">Author login</a>
    </p>
  </footer>
</body>
</html>
